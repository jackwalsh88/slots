<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#1a3566"/>
      <stop offset="1" stop-color="#081226"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.55" stop-color="#e2a53c"/>
      <stop offset="1" stop-color="#9a5f1c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="url(#bg)" stroke="#c9913a" stroke-width="2"/>
  <!-- bowstring, drawn back to the nock -->
  <path d="M9 39 L32 50 L55 39" fill="none" stroke="#f3e6c4" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- recurve bow: grip at centre, limbs sweeping down, tips flicking out -->
  <path d="M5 34 Q8 39 11 38 Q17 26 32 25 Q47 26 53 38 Q56 39 59 34"
        fill="none" stroke="url(#gold)" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="29.2" y="22.5" width="5.6" height="6" rx="1.6" fill="#7a4a16"/>
  <!-- cyan lightning arrow -->
  <g filter="url(#glow)">
    <line x1="32" y1="52" x2="32" y2="14" stroke="#41f2ff" stroke-width="3" stroke-linecap="round"/>
    <path d="M32 4 L39.5 16 L32 13.2 L24.5 16 Z" fill="#41f2ff"/>
    <path d="M32 47 L27.5 53 M32 47 L36.5 53" stroke="#41f2ff" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>
